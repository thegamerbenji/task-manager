<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<style>
  :root{
    --bg: #f6f5f1;
    --surface: #ffffff;
    --ink: #23262b;
    --ink-soft: #767a82;
    --line: #e6e3db;
    --school: #4c6b8a;
    --school-soft: #eaf0f5;
    --projects: #5c7a53;
    --projects-soft: #eef2ea;
    --danger: #b5544a;
    --radius: 12px;
    --accent: var(--school);
    --accent-soft: var(--school-soft);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Gate screen ---------- */
  .gate{
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 24px;
    transition: opacity .45s ease, transform .45s ease;
  }
  .gate.leaving{
    opacity: 0;
    transform: scale(.97);
    pointer-events: none;
  }

  .gate-title{
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: .02em;
    margin-bottom: 28px;
    opacity: 0;
    animation: riseIn .5s ease forwards;
  }

  .gate-cards{
    display:flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content:center;
  }

  .gate-card{
    width: 230px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 24px;
    cursor: pointer;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap: 14px;
    opacity: 0;
    transform: translateY(14px);
    animation: riseIn .55s ease forwards;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .gate-card:nth-child(1){ animation-delay: .05s; }
  .gate-card:nth-child(2){ animation-delay: .15s; }

  .gate-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 14px 30px -18px rgba(0,0,0,0.25);
  }
  .gate-card:active{ transform: translateY(-1px) scale(.99); }

  .gate-card .dot{
    width:14px;
    height:14px;
    border-radius:50%;
  }
  .gate-card.school:hover{ border-color: var(--school); }
  .gate-card.projects:hover{ border-color: var(--projects); }

  .gate-card h3{
    margin:0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .gate-card p{
    margin:0;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  @keyframes riseIn{
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---------- Board ---------- */
  .app{
    max-width: 620px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    opacity: 0;
    transform: translateY(10px);
  }
  .app.entering{
    animation: boardIn .45s ease forwards;
  }
  @keyframes boardIn{
    to{ opacity:1; transform: translateY(0); }
  }

  header.top{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .back-btn{
    border:none;
    background:none;
    color: var(--ink-soft);
    font-size: 18px;
    cursor:pointer;
    padding: 4px 6px;
    border-radius: 8px;
    line-height:1;
    transition: background .15s ease, color .15s ease;
  }
  .back-btn:hover{ background: var(--surface); color: var(--ink); }

  header.top h1{
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin:0;
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
  }

  .switch-btn{
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 550;
    padding: 7px 12px;
    border-radius: 20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition: border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .switch-btn:hover{ color: var(--ink); border-color: var(--ink-soft); transform: translateY(-1px); }
  .switch-btn .dot{ width:7px; height:7px; border-radius:50%; }

  .count{
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 2px 9px;
    border-radius: 20px;
  }

  .task-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    min-height: 40px;
  }

  .task-list.drag-over{
    background: rgba(0,0,0,0.02);
    border-radius: 10px;
    outline: 1.5px dashed var(--line);
    outline-offset: 3px;
  }

  .task{
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 11px 11px 9px;
    display:flex;
    gap:9px;
    align-items:flex-start;
    background: var(--surface);
    cursor: grab;
    transform-origin: top center;
    animation: taskIn .3s cubic-bezier(.2,.8,.3,1) both;
    transition: box-shadow .18s ease, opacity .18s ease, transform .18s ease;
  }
  @keyframes taskIn{
    from{ opacity:0; transform: translateY(-8px) scale(.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .task.removing{
    animation: taskOut .22s ease forwards;
  }
  @keyframes taskOut{
    to{ opacity:0; transform: translateX(14px) scale(.96); margin-bottom:-9px; padding-top:0; padding-bottom:0; max-height:0; }
  }

  .task:hover{ box-shadow: 0 8px 20px -16px rgba(0,0,0,0.3); }
  .task:active{ cursor:grabbing; }
  .task.dragging{ opacity: .35; }

  .task.done{ background: var(--bg); }
  .task.done .task-text{ text-decoration: line-through; color: var(--ink-soft); }

  .handle{
    color: #cfccc2;
    font-size: 13px;
    line-height: 1;
    padding: 3px 2px 0 0;
    user-select:none;
    flex-shrink:0;
  }

  .checkbox{
    width:17px;
    height:17px;
    border-radius: 5px;
    border: 1.5px solid var(--line);
    margin-top: 2px;
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--surface);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease;
  }
  .checkbox:active{ transform: scale(.85); }
  .checkbox.checked{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
    font-size: 11px;
    animation: pop .28s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{
    0%{ transform: scale(.7); }
    60%{ transform: scale(1.15); }
    100%{ transform: scale(1); }
  }

  .task-body{ flex:1; min-width:0; }

  .task-text{
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
    outline:none;
    padding: 1px 0;
  }
  .task-text[contenteditable="true"]{ border-bottom: 1px solid var(--line); }

  .task-img{
    margin-top: 8px;
    max-width: 100%;
    max-height: 140px;
    border-radius: 8px;
    display:block;
    cursor: zoom-in;
    border: 1px solid var(--line);
    transition: transform .2s ease;
  }
  .task-img:hover{ transform: scale(1.015); }

  .task-actions{
    display:flex;
    gap: 5px;
    flex-shrink:0;
    opacity: 0;
    transform: translateX(4px);
    transition: opacity .15s ease, transform .15s ease;
  }
  .task:hover .task-actions{ opacity: 1; transform: translateX(0); }

  .icon-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    cursor:pointer;
    padding: 3px;
    font-size: 13px;
    line-height:1;
    border-radius: 5px;
    transition: background .12s ease, color .12s ease;
  }
  .icon-btn:hover{ background: var(--bg); color: var(--ink); }
  .icon-btn.remove:hover{ color: var(--danger); }

  .add-row{
    margin-top: 16px;
    display:flex;
    gap:8px;
    align-items:center;
  }

  .add-row input[type="text"]{
    flex:1;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 13.5px;
    font-family: inherit;
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .add-row input[type="text"]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .img-btn, .plus-btn{
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor:pointer;
    font-size: 15px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease, color .15s ease, border-color .15s ease;
  }
  .img-btn:hover{ color: var(--ink); border-color: var(--ink-soft); }

  .plus-btn{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
    font-size: 19px;
    font-weight: 400;
  }
  .plus-btn:hover{ background: var(--accent); border-color: var(--accent); transform: scale(1.06) rotate(90deg); }
  .plus-btn:active{ transform: scale(.92) rotate(90deg); }

  .img-btn.pending{ color: var(--accent); border-color: var(--accent); }

  .empty-hint{
    font-size: 13px;
    color: var(--ink-soft);
    padding: 20px 2px;
    text-align:center;
  }

  .lightbox{
    position: fixed;
    inset:0;
    background: rgba(20,20,20,0.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 999;
    padding: 40px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    animation: riseIn .25s ease;
  }

  ::selection{ background: var(--accent-soft); }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-title" id="gate-title">Pick a board to open</div>
  <div class="gate-cards">
    <div class="gate-card school" data-group="school">
      <span class="dot" style="background:var(--school)"></span>
      <h3>School</h3>
      <p>Assignments, readings, deadlines.</p>
    </div>
    <div class="gate-card projects" data-group="projects">
      <span class="dot" style="background:var(--projects)"></span>
      <h3>My Projects</h3>
      <p>Everything you're building on your own.</p>
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <header class="top">
    <button class="back-btn" id="back-btn" title="Back to boards">←</button>
    <h1><span class="dot" id="active-dot" style="width:9px;height:9px;border-radius:50%;"></span><span id="active-title"></span></h1>
    <span class="count" id="task-count">0</span>
    <button class="switch-btn" id="switch-btn">
      <span class="dot"></span>
      <span id="switch-label"></span>
    </button>
  </header>

  <div class="task-list" id="task-list"></div>

  <div class="add-row">
    <input type="text" id="task-input" placeholder="Add a task…" />
    <input type="file" accept="image/*" id="file-input" style="display:none">
    <button class="img-btn" id="img-btn" title="Attach image">🖼</button>
    <button class="plus-btn" id="add-btn" title="Add task">+</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="attachment preview">
</div>

<script>
(function(){
  let idCounter = 1;
  const state = {
    school: [
      { id:'seed1', text:'Finish reading chapter 4', done:false, image:null },
      { id:'seed2', text:'Math problem set due Friday', done:false, image:null }
    ],
    projects: [
      { id:'seed3', text:'Sketch UI for new addon', done:false, image:null }
    ]
  };
  const meta = {
    school: { label: 'School', color: 'var(--school)', soft: 'var(--school-soft)' },
    projects: { label: 'My Projects', color: 'var(--projects)', soft: 'var(--projects-soft)' }
  };
  let activeGroup = null;
  let pendingImage = null;

  function uid(){ return 't' + (idCounter++); }

  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const listEl = document.getElementById('task-list');
  const countEl = document.getElementById('task-count');
  const inputEl = document.getElementById('task-input');
  const fileInput = document.getElementById('file-input');
  const imgBtn = document.getElementById('img-btn');
  const addBtn = document.getElementById('add-btn');
  const switchBtn = document.getElementById('switch-btn');
  const switchLabel = document.getElementById('switch-label');
  const activeTitle = document.getElementById('active-title');
  const activeDot = document.getElementById('active-dot');
  const backBtn = document.getElementById('back-btn');

  document.querySelectorAll('.gate-card').forEach(card => {
    card.addEventListener('click', () => openBoard(card.dataset.group));
  });

  function openBoard(group){
    activeGroup = group;
    gate.classList.add('leaving');
    setTimeout(() => {
      gate.style.display = 'none';
      app.style.display = 'block';
      void app.offsetWidth; // restart animation
      app.classList.add('entering');
      setActiveGroupUI();
      renderTasks();
    }, 420);
  }

  function setActiveGroupUI(){
    const m = meta[activeGroup];
    const other = activeGroup === 'school' ? 'projects' : 'school';
    const om = meta[other];

    document.documentElement.style.setProperty('--accent', m.color);
    document.documentElement.style.setProperty('--accent-soft', m.soft);
    activeTitle.textContent = m.label;
    activeDot.style.background = m.color;
    switchLabel.textContent = om.label;
    switchBtn.querySelector('.dot').style.background = om.color;
  }

  switchBtn.addEventListener('click', () => {
    const other = activeGroup === 'school' ? 'projects' : 'school';
    app.style.transition = 'opacity .2s ease, transform .2s ease';
    app.style.opacity = '0';
    app.style.transform = 'translateY(6px)';
    setTimeout(() => {
      activeGroup = other;
      setActiveGroupUI();
      renderTasks();
      app.style.opacity = '1';
      app.style.transform = 'translateY(0)';
    }, 200);
  });

  backBtn.addEventListener('click', () => {
    app.classList.remove('entering');
    app.style.opacity = '0';
    app.style.transform = 'translateY(10px)';
    setTimeout(() => {
      app.style.display = 'none';
      gate.style.display = 'flex';
      gate.classList.remove('leaving');
      // restart gate entrance animation
      gate.querySelectorAll('.gate-card, .gate-title').forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
    }, 200);
  });

  function renderTasks(){
    const tasks = state[activeGroup];
    countEl.textContent = tasks.length;
    listEl.innerHTML = '';

    if(tasks.length === 0){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'Nothing here yet — add your first task below.';
      listEl.appendChild(hint);
      return;
    }
    tasks.forEach(task => listEl.appendChild(buildTaskEl(task)));
  }

  function removeTaskAnimated(task){
    const el = listEl.querySelector('.task[data-id="' + task.id + '"]');
    if(el){
      el.classList.add('removing');
      setTimeout(() => {
        state[activeGroup] = state[activeGroup].filter(t => t.id !== task.id);
        renderTasks();
      }, 220);
    } else {
      state[activeGroup] = state[activeGroup].filter(t => t.id !== task.id);
      renderTasks();
    }
  }

  function buildTaskEl(task){
    const el = document.createElement('div');
    el.className = 'task' + (task.done ? ' done' : '');
    el.draggable = true;
    el.dataset.id = task.id;

    el.addEventListener('dragstart', (e) => {
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', task.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));

    const handle = document.createElement('div');
    handle.className = 'handle';
    handle.textContent = '⠿';
    el.appendChild(handle);

    const checkbox = document.createElement('div');
    checkbox.className = 'checkbox' + (task.done ? ' checked' : '');
    checkbox.textContent = task.done ? '✓' : '';
    checkbox.addEventListener('click', () => {
      task.done = !task.done;
      renderTasks();
    });
    el.appendChild(checkbox);

    const body = document.createElement('div');
    body.className = 'task-body';

    const text = document.createElement('div');
    text.className = 'task-text';
    text.textContent = task.text;
    text.addEventListener('click', () => {
      if(text.getAttribute('contenteditable') === 'true') return;
      startEdit();
    });
    body.appendChild(text);

    function startEdit(){
      text.setAttribute('contenteditable', 'true');
      text.focus();
      placeCaretAtEnd(text);
      const finish = () => {
        text.removeAttribute('contenteditable');
        const newVal = text.textContent.trim();
        task.text = newVal.length ? newVal : task.text;
        text.textContent = task.text;
        text.removeEventListener('blur', finish);
        text.removeEventListener('keydown', onKey);
      };
      const onKey = (e) => {
        if(e.key === 'Enter'){ e.preventDefault(); text.blur(); }
        if(e.key === 'Escape'){ text.textContent = task.text; text.blur(); }
      };
      text.addEventListener('blur', finish);
      text.addEventListener('keydown', onKey);
    }

    if(task.image){
      const img = document.createElement('img');
      img.className = 'task-img';
      img.src = task.image;
      img.addEventListener('click', () => openLightbox(task.image));
      body.appendChild(img);
    }

    el.appendChild(body);

    const actions = document.createElement('div');
    actions.className = 'task-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn';
    editBtn.title = 'Edit';
    editBtn.textContent = '✎';
    editBtn.addEventListener('click', startEdit);
    actions.appendChild(editBtn);

    const taskImgBtn = document.createElement('button');
    taskImgBtn.className = 'icon-btn';
    taskImgBtn.title = task.image ? 'Replace image' : 'Add image';
    taskImgBtn.textContent = '🖼';
    taskImgBtn.addEventListener('click', () => {
      const fi = document.createElement('input');
      fi.type = 'file';
      fi.accept = 'image/*';
      fi.addEventListener('change', () => {
        const f = fi.files[0];
        if(f) readImageFile(f, (dataUrl) => { task.image = dataUrl; renderTasks(); });
      });
      fi.click();
    });
    actions.appendChild(taskImgBtn);

    if(task.image){
      const removeImgBtn = document.createElement('button');
      removeImgBtn.className = 'icon-btn';
      removeImgBtn.title = 'Remove image';
      removeImgBtn.textContent = '⤫';
      removeImgBtn.addEventListener('click', () => { task.image = null; renderTasks(); });
      actions.appendChild(removeImgBtn);
    }

    const removeBtn = document.createElement('button');
    removeBtn.className = 'icon-btn remove';
    removeBtn.title = 'Delete';
    removeBtn.textContent = '🗑';
    removeBtn.addEventListener('click', () => removeTaskAnimated(task));
    actions.appendChild(removeBtn);

    el.appendChild(actions);

    el.addEventListener('dragover', (e) => {
      if(e.dataTransfer.types.includes('Files')) e.preventDefault();
    });
    el.addEventListener('drop', (e) => {
      if(e.dataTransfer.files && e.dataTransfer.files.length){
        e.preventDefault();
        e.stopPropagation();
        const f = e.dataTransfer.files[0];
        if(f.type.startsWith('image/')){
          readImageFile(f, (dataUrl) => { task.image = dataUrl; renderTasks(); });
        }
      }
    });

    return el;
  }

  function placeCaretAtEnd(el){
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function readImageFile(file, cb){
    const reader = new FileReader();
    reader.onload = () => cb(reader.result);
    reader.readAsDataURL(file);
  }

  function openLightbox(src){
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });

  function addTask(){
    const val = inputEl.value.trim();
    if(!val && !pendingImage) return;
    state[activeGroup].push({
      id: uid(),
      text: val || 'Untitled task',
      done: false,
      image: pendingImage
    });
    inputEl.value = '';
    pendingImage = null;
    imgBtn.classList.remove('pending');
    renderTasks();
  }

  addBtn.addEventListener('click', () => {
    addBtn.style.transform = 'scale(.85) rotate(90deg)';
    setTimeout(() => addBtn.style.transform = '', 120);
    addTask();
  });
  inputEl.addEventListener('keydown', (e) => { if(e.key === 'Enter') addTask(); });

  imgBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if(f){
      readImageFile(f, (dataUrl) => {
        pendingImage = dataUrl;
        imgBtn.classList.add('pending');
      });
    }
  });

  listEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    listEl.classList.add('drag-over');
  });
  listEl.addEventListener('dragleave', () => listEl.classList.remove('drag-over'));
  listEl.addEventListener('drop', (e) => {
    e.preventDefault();
    listEl.classList.remove('drag-over');

    if(e.dataTransfer.files && e.dataTransfer.files.length){
      const f = e.dataTransfer.files[0];
      if(f.type.startsWith('image/')){
        readImageFile(f, (dataUrl) => {
          state[activeGroup].push({ id: uid(), text: 'New task', done:false, image: dataUrl });
          renderTasks();
        });
      }
      return;
    }

    const id = e.dataTransfer.getData('text/plain');
    if(!id) return;
    const arr = state[activeGroup];
    const idx = arr.findIndex(t => t.id === id);
    if(idx === -1) return;
    const [task] = arr.splice(idx, 1);

    const taskEls = [...listEl.querySelectorAll('.task')];
    let insertAt = arr.length;
    for(let i=0;i<taskEls.length;i++){
      const rect = taskEls[i].getBoundingClientRect();
      if(e.clientY < rect.top + rect.height/2){ insertAt = i; break; }
    }
    arr.splice(insertAt, 0, task);
    renderTasks();
  });
})();
</script>

</body>
</html>
